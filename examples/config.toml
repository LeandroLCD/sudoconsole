# sudoconsole configuration — annotated example.
#
# Copy to:
#   Linux:    ~/.config/sudoconsole/config.toml
#   macOS:    ~/Library/Application Support/sudoconsole/config.toml
# Verify with: `sudoconsole config show`

[cache]
# sudo timestamp lifetime. 60-3600 seconds.
timeout_seconds       = 900
# Within this window of expiration, the cache is refreshed
# silently (no password prompt).
refresh_before_seconds = 60
# Set to true to disable the cache entirely. Every `exec`
# would then require `sudo -v` first.
disabled = false

[security]
# Zeroize the credential buffer after use.
purge_memory      = true
# Set RLIMIT_CORE=0 on the parent so a coredump can never
# contain the password.
disable_core_dumps = true
# Refuse to run when stdin is not a TTY. Disable for CI
# pipelines that supply the password via $SUDOCONSOLE_PASSWORD.
require_tty = true

# ----------------------------------------------------------------------
# Policy
# ----------------------------------------------------------------------

[policy]

# Mode: "blocklist" (default), "allowlist", or "audit".
#   blocklist: Block exits 64 unless --policy-override is supplied.
#   allowlist: Everything exits 64 except [policy.allowed] entries.
#   audit:    Block is logged but the command still runs.
mode = "blocklist"

[policy.blocked]
# Built-in categories enabled here. Each can be tightened via the
# corresponding [policy.remote_access] / [policy.credential_exposure]
# sections below.
categories = ["remote_access", "credential_exposure"]
# Commands blocked by first-argv match.
commands   = []
# Glob or regex patterns blocked by full-line match.
# Patterns starting with `re:` are treated as Go regex.
# ReDoS-prone patterns are rejected at load time.
patterns   = ["re:ssh\\s+-R\\s+", "re:ssh\\s+-L\\s+", "curl\\s+.*\\|\\s*sh"]

[policy.allowed]
# Used in `allowlist` mode. Ignored in `blocklist` mode.
categories = []
commands   = []
patterns   = ["apt update", "apt-get install*", "systemctl restart *"]

[policy.remote_access]
block_reverse_tunnels = true   # ssh -R, ncat -e, chisel reverse
block_port_forward    = true   # ssh -L, ncat -l
block_shell_spawn     = true   # ssh + bash, python -c 'import pty'
block_tunnels         = true   # ssh -w, wireguard, socat

[policy.credential_exposure]
block_passwd_change = true     # passwd, chpasswd
block_shadow_edit    = true     # vipw, edit /etc/shadow
block_sudoers_edit   = true     # visudo, edit /etc/sudoers
block_ssh_key_export = true     # ssh-keygen, ssh-copy-id
block_secret_export  = true     # printenv, env, cat .env

[policy.audit]
# JSONL file appended on every decision. The parent directory must
# exist; sudoconsole does NOT create it for you.
log_file    = "~/.local/share/sudoconsole/audit.log"
log_blocked = true
log_allowed = true
log_warned  = true
# Truncate + rotate when the log exceeds this size. 0 disables.
max_bytes   = 10485760

# Extra patterns appended to the runtime matcher. Useful for
# one-off blocklists without modifying the built-in defaults.
extra_patterns = []

# ----------------------------------------------------------------------
# Agents
# ----------------------------------------------------------------------

[agent]
# Discover installed agents before `install` / `uninstall`.
auto_detect = true
# Restrict `install` to these agents. Empty = auto-detect.
# Valid values: kilo, claude, gemini, aider, codex, copilot, generic.
install = []
# Where `install` writes wrapper scripts.
bin_dir  = "~/bin"

# ----------------------------------------------------------------------
# Output
# ----------------------------------------------------------------------

[output]
# human | json
format    = "human"
# silent | error | warn | info | debug
log_level = "info"