# Valid sudoconsole config fixture used by integration tests.
# Mirrors internal/infrastructure/config/loader_test.go::validTOML.

[cache]
timeout_seconds = 600
refresh_before_seconds = 60
disabled = false

[security]
purge_memory = true
disable_core_dumps = true
require_tty = true

[policy]
mode = "allowlist"

[policy.blocked]
categories = ["remote_access", "shell_spawn"]
commands = ["rm", "dd"]
patterns = ["^wget\\s+"]

[policy.allowed]
categories = ["package_manager"]
commands = ["apt", "dnf"]

[policy.audit]
log_file = "/var/log/sudoconsole.jsonl"
log_blocked = true
log_warned = true
max_bytes = 1048576

[policy.remote_access]
block_reverse_tunnels = true
block_port_forward = true
block_shell_spawn = false
block_tunnels = true

[policy.credential_exposure]
block_passwd_change = true
block_sudoers_edit = false

[agent]
auto_detect = true
install = ["kilo", "claude"]
bin_dir = "/opt/bin"

[output]
format = "json"
log_level = "debug"
