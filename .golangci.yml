version: "2"
run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - gocyclo
    - misspell
    - ineffassign
    - unused
    - bodyclose
    - errorlint
    - gocritic
    - thelper
    - tparallel
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
          - dupl
          - goconst
      - path: test/integration/
        linters:
          - errcheck
          - gosec
          - unused
  settings:
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: exported
          arguments:
            - "disableChecksOnConstants"
        - name: time-naming
        - name: context-as-argument
        - name: context-keys-type

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: ["github.com/LeandroLCD/sudoconsole"]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0