name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Required by GoReleaser for cosign keyless signing on checksum.
  id-token: write

jobs:
  release:
    name: Build + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      # cosign (for the goreleaser signs block).
      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      # nfpm is invoked indirectly via goreleaser, but on Ubuntu
      # 24.04 it ships with apt so no extra install is needed.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # On dispatch we run a snapshot so the dry-run can be
          # triggered manually without burning a tag.
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean --skip publish' || 'release --clean' }}
          version: latest
          distribution: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cosign uses OIDC + GitHub Actions' token to produce a
          # keyless signature; no extra secret required.
          COSIGN_EXPERIMENTAL: 1